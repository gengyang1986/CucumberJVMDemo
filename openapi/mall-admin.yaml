        - {name: sort, in: query, required: true, schema: {type: integer}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /home/recommendSubject/delete:
