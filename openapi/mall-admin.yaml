openapi: 3.0.3
info:
  title: mall-admin 后台管理接口文档
  description: >-
    由 back 仓库 (master, dcaa93b) 源码分析生成。Controller 位于 com.macro.mall.controller，
    对应 mall-admin/src/main/resources/application.yml 的 springdoc group-configs(group='default')。
    统一返回体 CommonResult；分页数据封装 CommonPage。
    鉴权：除 secure.ignored.urls 白名单（/admin/login、/admin/register、/admin/info、/admin/logout、/minio/upload、/aliyun/oss/policy）外均需 JWT（Header: Authorization，前缀 'Bearer '）。
    端口：源码配置未见显式 server.port，此处按 Spring Boot 默认 8080 填写；无 context-path。
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: 本地开发环境（默认端口 8080，未见显式 server.port 配置）
tags:
  - {name: UmsAdmin, description: 后台用户管理}
  - {name: UmsRole, description: 后台用户角色管理}
  - {name: UmsMenu, description: 后台菜单管理}
  - {name: UmsResource, description: 后台资源管理}
  - {name: UmsResourceCategory, description: 后台资源分类管理}
  - {name: UmsMemberLevel, description: 会员等级管理}
  - {name: PmsBrand, description: 商品品牌管理}
  - {name: PmsProduct, description: 商品管理}
  - {name: PmsProductCategory, description: 商品分类管理}
  - {name: PmsProductAttribute, description: 商品属性管理}
  - {name: PmsProductAttributeCategory, description: 商品属性分类管理}
  - {name: PmsSkuStock, description: sku商品库存管理}
  - {name: OmsOrder, description: 订单管理}
  - {name: OmsOrderReturnApply, description: 订单退货申请管理}
  - {name: OmsOrderReturnReason, description: 退货原因管理}
  - {name: OmsOrderSetting, description: 订单设置管理}
  - {name: OmsCompanyAddress, description: 收货地址管理}
  - {name: CmsPrefrenceArea, description: 商品优选管理}
  - {name: CmsSubject, description: 商品专题管理}
  - {name: Minio, description: MinIO对象存储管理}
  - {name: Oss, description: Oss对象存储管理}
  - {name: SmsCoupon, description: 优惠券管理}
  - {name: SmsCouponHistory, description: 优惠券领取记录管理}
  - {name: SmsFlashPromotion, description: 限时购活动管理}
  - {name: SmsFlashPromotionSession, description: 限时购场次管理}
  - {name: SmsFlashPromotionProductRelation, description: 限时购和商品关系管理}
  - {name: SmsHomeAdvertise, description: 首页轮播广告管理}
  - {name: SmsHomeBrand, description: 首页品牌管理}
  - {name: SmsHomeNewProduct, description: 首页新品管理}
  - {name: SmsHomeRecommendProduct, description: 首页人气推荐管理}
  - {name: SmsHomeRecommendSubject, description: 首页专题推荐管理}
security:
  - bearerAuth: []
paths:
  /admin/register:
    post:
      tags: [UmsAdmin]
      summary: 用户注册
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UmsAdminParam'}}}}
      responses: {'200': {description: '注册成功返回 CommonResult<UmsAdmin>；失败返回 code=500', content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultUmsAdmin'}}}}}
  /admin/login:
    post:
      tags: [UmsAdmin]
      summary: 登录以后返回token
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UmsAdminLoginParam'}}}}
      responses: {'200': {description: '成功返回 {token, tokenHead}；用户名或密码错误返回 code=404', content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultTokenMap'}}}}}
  /admin/refreshToken:
    get:
      tags: [UmsAdmin]
      summary: 刷新token
      security: []
      parameters:
        - {name: Authorization, in: header, required: false, schema: {type: string}, description: 旧 token，取自 jwt.tokenHeader}
      responses: {'200': {description: 'token 已过期返回 code=500(message=token已经过期！)', content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultTokenMap'}}}}}
  /admin/info:
    get:
      tags: [UmsAdmin]
      summary: 获取当前登录用户信息
      security: []
      description: 在白名单中，但 Principal 为空时返回 code=401
      responses: {'200': {description: '返回 {username, menus, icon, roles}', content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultMap'}}}}}
  /admin/logout:
    post:
      tags: [UmsAdmin]
      summary: 登出功能
      security: []
      responses: {'200': {description: 登出结果, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResult'}}}}}
  /admin/list:
    get:
      tags: [UmsAdmin]
      summary: 根据用户名或姓名分页获取用户列表
      parameters:
        - {name: keyword, in: query, required: false, schema: {type: string}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, default: 5}}
        - {name: pageNum, in: query, required: false, schema: {type: integer, default: 1}}
      responses: {'200': {description: 分页用户列表, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultCommonPageUmsAdmin'}}}}}
  /admin/{id}:
    get:
      tags: [UmsAdmin]
      summary: 获取指定用户信息
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: 用户信息, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultUmsAdmin'}}}}}
  /admin/update/{id}:
    post:
      tags: [UmsAdmin]
      summary: 修改指定用户信息
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UmsAdmin'}}}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /admin/updatePassword:
    post:
      tags: [UmsAdmin]
      summary: 修改指定用户密码
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAdminPasswordParam'}}}}
      responses: {'200': {description: '成功返回状态；-1 提交参数不合法；-2 找不到该用户；-3 旧密码错误', content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /admin/delete/{id}:
    post:
      tags: [UmsAdmin]
      summary: 删除指定用户信息
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /admin/updateStatus/{id}:
    post:
      tags: [UmsAdmin]
      summary: 修改帐号状态
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: status, in: query, required: true, schema: {type: integer}, description: 帐号启用状态 0->禁用；1->启用}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /admin/role/update:
    post:
      tags: [UmsAdmin]
      summary: 给用户分配角色
      parameters:
        - {name: adminId, in: query, required: true, schema: {type: integer, format: int64}}
        - name: roleIds
          in: query
          required: true
          schema: {type: array, items: {type: integer, format: int64}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /admin/role/{adminId}:
    get:
      tags: [UmsAdmin]
      summary: 获取指定用户的角色
      parameters:
        - {name: adminId, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: 角色列表, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultListUmsRole'}}}}}
  /role/create:
    post:
      tags: [UmsRole]
      summary: 添加角色
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UmsRole'}}}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /role/update/{id}:
    post:
      tags: [UmsRole]
      summary: 修改角色
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UmsRole'}}}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /role/delete:
    post:
      tags: [UmsRole]
      summary: 批量删除角色
      parameters:
        - name: ids
          in: query
          required: true
          schema: {type: array, items: {type: integer, format: int64}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /role/listAll:
    get:
      tags: [UmsRole]
      summary: 获取所有角色
      responses: {'200': {description: 角色列表, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultListUmsRole'}}}}}
  /role/list:
    get:
      tags: [UmsRole]
      summary: 根据角色名称分页获取角色列表
      parameters:
        - {name: keyword, in: query, required: false, schema: {type: string}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, default: 5}}
        - {name: pageNum, in: query, required: false, schema: {type: integer, default: 1}}
      responses: {'200': {description: 分页角色列表, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultCommonPageUmsRole'}}}}}
  /role/updateStatus/{id}:
    post:
      tags: [UmsRole]
      summary: 修改角色状态
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: status, in: query, required: true, schema: {type: integer}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /role/listMenu/{roleId}:
    get:
      tags: [UmsRole]
      summary: 获取角色相关菜单
      parameters:
        - {name: roleId, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: 菜单列表, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultListUmsMenu'}}}}}
  /role/listResource/{roleId}:
    get:
      tags: [UmsRole]
      summary: 获取角色相关资源
      parameters:
        - {name: roleId, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: 资源列表, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultListUmsResource'}}}}}
  /role/allocMenu:
    post:
      tags: [UmsRole]
      summary: 给角色分配菜单
      parameters:
        - {name: roleId, in: query, required: true, schema: {type: integer, format: int64}}
        - name: menuIds
          in: query
          required: true
          schema: {type: array, items: {type: integer, format: int64}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /role/allocResource:
    post:
      tags: [UmsRole]
      summary: 给角色分配资源
      parameters:
        - {name: roleId, in: query, required: true, schema: {type: integer, format: int64}}
        - name: resourceIds
          in: query
          required: true
          schema: {type: array, items: {type: integer, format: int64}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /menu/create:
    post:
      tags: [UmsMenu]
      summary: 添加后台菜单
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UmsMenu'}}}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /menu/update/{id}:
    post:
      tags: [UmsMenu]
      summary: 修改后台菜单
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UmsMenu'}}}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /menu/{id}:
    get:
      tags: [UmsMenu]
      summary: 根据ID获取菜单详情
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: 菜单详情, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultUmsMenu'}}}}}
  /menu/delete/{id}:
    post:
      tags: [UmsMenu]
      summary: 根据ID删除后台菜单
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /menu/list/{parentId}:
    get:
      tags: [UmsMenu]
      summary: 分页查询后台菜单
      parameters:
        - {name: parentId, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, default: 5}}
        - {name: pageNum, in: query, required: false, schema: {type: integer, default: 1}}
      responses: {'200': {description: 分页菜单列表, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultCommonPageUmsMenu'}}}}}
  /menu/treeList:
    get:
      tags: [UmsMenu]
      summary: 树形结构返回所有菜单列表
      responses: {'200': {description: 菜单树, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultListUmsMenuNode'}}}}}
  /menu/updateHidden/{id}:
    post:
      tags: [UmsMenu]
      summary: 修改菜单显示状态
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: hidden, in: query, required: true, schema: {type: integer}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /resource/create:
    post:
      tags: [UmsResource]
      summary: 添加后台资源
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UmsResource'}}}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /resource/update/{id}:
    post:
      tags: [UmsResource]
      summary: 修改后台资源
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UmsResource'}}}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /resource/{id}:
    get:
      tags: [UmsResource]
      summary: 根据ID获取资源详情
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: 资源详情, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultUmsResource'}}}}}
  /resource/delete/{id}:
    post:
      tags: [UmsResource]
      summary: 根据ID删除后台资源
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /resource/list:
    get:
      tags: [UmsResource]
      summary: 分页模糊查询后台资源
      parameters:
        - {name: categoryId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: nameKeyword, in: query, required: false, schema: {type: string}}
        - {name: urlKeyword, in: query, required: false, schema: {type: string}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, default: 5}}
        - {name: pageNum, in: query, required: false, schema: {type: integer, default: 1}}
      responses: {'200': {description: 分页资源列表, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultCommonPageUmsResource'}}}}}
  /resource/listAll:
    get:
      tags: [UmsResource]
      summary: 查询所有后台资源
      responses: {'200': {description: 资源列表, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultListUmsResource'}}}}}
  /resourceCategory/listAll:
    get:
      tags: [UmsResourceCategory]
      summary: 查询所有后台资源分类
      responses: {'200': {description: 资源分类列表, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultListUmsResourceCategory'}}}}}
  /resourceCategory/create:
    post:
      tags: [UmsResourceCategory]
      summary: 添加后台资源分类
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UmsResourceCategory'}}}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /resourceCategory/update/{id}:
    post:
      tags: [UmsResourceCategory]
      summary: 修改后台资源分类
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UmsResourceCategory'}}}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /resourceCategory/delete/{id}:
    post:
      tags: [UmsResourceCategory]
      summary: 根据ID删除后台资源分类
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /memberLevel/list:
    get:
      tags: [UmsMemberLevel]
      summary: 查询所有会员等级
      parameters:
        - {name: defaultStatus, in: query, required: true, schema: {type: integer}, description: 是否为默认等级 0->否；1->是}
      responses: {'200': {description: 会员等级列表, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultListUmsMemberLevel'}}}}}
  /brand/listAll:
    get:
      tags: [PmsBrand]
      summary: 获取全部品牌列表
      responses: {'200': {description: 品牌列表, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultListPmsBrand'}}}}}
  /brand/create:
    post:
      tags: [PmsBrand]
      summary: 添加品牌
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PmsBrandParam'}}}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /brand/update/{id}:
    post:
      tags: [PmsBrand]
      summary: 更新品牌
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PmsBrandParam'}}}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /brand/delete/{id}:
    get:
      tags: [PmsBrand]
      summary: 删除品牌
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: '成功返回 code=200，data=null；失败 code=500', content: {application/json: {schema: {$ref: '#/components/schemas/CommonResult'}}}}}
  /brand/list:
    get:
      tags: [PmsBrand]
      summary: 根据品牌名称分页获取品牌列表
      parameters:
        - {name: keyword, in: query, required: false, schema: {type: string}}
        - {name: showStatus, in: query, required: false, schema: {type: integer}}
        - {name: pageNum, in: query, required: false, schema: {type: integer, default: 1}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, default: 5}}
      responses: {'200': {description: 分页品牌列表, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultCommonPagePmsBrand'}}}}}
  /brand/{id}:
    get:
      tags: [PmsBrand]
      summary: 根据编号查询品牌信息
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: 品牌详情, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultPmsBrand'}}}}}
  /brand/delete/batch:
    post:
      tags: [PmsBrand]
      summary: 批量删除品牌
      parameters:
        - name: ids
          in: query
          required: true
          schema: {type: array, items: {type: integer, format: int64}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /brand/update/showStatus:
    post:
      tags: [PmsBrand]
      summary: 批量更新显示状态
      parameters:
        - name: ids
          in: query
          required: true
          schema: {type: array, items: {type: integer, format: int64}}
        - {name: showStatus, in: query, required: true, schema: {type: integer}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /brand/update/factoryStatus:
    post:
      tags: [PmsBrand]
      summary: 批量更新厂家制造商状态
      parameters:
        - name: ids
          in: query
          required: true
          schema: {type: array, items: {type: integer, format: int64}}
        - {name: factoryStatus, in: query, required: true, schema: {type: integer}}
      responses: {'200': {description: 受影响行数, content: {application/json: {schema: {$ref: '#/components/schemas/CommonResultInteger'}}}}}
  /product/create:
    post:
      tags: [PmsProduct]
