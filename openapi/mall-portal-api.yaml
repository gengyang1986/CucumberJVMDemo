openapi: 3.0.3
info:
  title: mall-portal 前台接口（依据 back 仓 mall-portal 源码生成）
  version: 1.0.0
  description: |
    本文件由 back 仓 mall-portal 模块 controller 包下 13 个 Controller 的源码直接生成，共 65 个接口；schema 字段取自 portal.domain 与 mall-mbg 的实际属性。
    约定：
    1. 端口 8085，无 context-path（application-dev.yml / application-prod.yml 中 server.port=8085）。
    2. 除白名单接口外，均需在请求头 Authorization 携带 `Bearer <token>`；token 由 POST /sso/login 返回（响应 data 中 token + tokenHead，过期时间 604800 秒即 7 天），GET /sso/refreshToken 可续期（需带旧 token）。
    3. 白名单来自 application.yml 的 secure.ignored.urls：/sso/**、/home/**、/product/**、/brand/**、/alipay/**；本文件中这些接口标注 security: []。
    4. 业务返回统一为 CommonResult{code,message,data}，HTTP 状态通常为 200；code 含义 200 成功、404 参数校验失败、401 未登录或 token 过期、403 无权限、500 操作失败（见 ResultCode）。
    5. 标注 @RequestParam 的 POST 接口，参数既可放 query 也可放 application/x-www-form-urlencoded 表单；本文件按常见调用方式给出（登录/注册/改密用表单提交，其余用 query）。
    6. 标注 @RequestBody 的接口必须使用 application/json。
servers:
  - url: http://localhost:8085
    description: dev/prod 配置端口（server.port=8085）
security:
  - bearerAuth: []
tags:
  - name: 购物车
    description: OmsCartItemController
  - name: 会员登录注册
    description: UmsMemberController
  - name: 订单
    description: OmsPortalOrderController
  - name: 首页
    description: HomeController
  - name: 商品
    description: PmsPortalProductController
  - name: 品牌
    description: PmsPortalBrandController
  - name: 品牌关注
    description: MemberAttentionController
  - name: 商品收藏
    description: MemberProductCollectionController
  - name: 浏览记录
    description: MemberReadHistoryController
  - name: 优惠券
    description: UmsMemberCouponController
  - name: 收货地址
    description: UmsMemberReceiveAddressController
  - name: 退货申请
    description: OmsPortalOrderReturnApplyController
  - name: 支付宝
    description: AlipayController
paths:
  /cart/add:
    post:
      tags: [购物车]
      summary: 添加商品到购物车
      operationId: cartAdd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OmsCartItem'
      responses:
        '200':
          description: 影响行数 > 0 返回成功，否则 code=500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInt'
  /cart/list:
    get:
      tags: [购物车]
      summary: 获取当前会员的购物车列表
      operationId: cartList
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListOmsCartItem'
  /cart/list/promotion:
    get:
      tags: [购物车]
      summary: 获取当前会员的购物车列表（含促销信息）
      operationId: cartListPromotion
      parameters:
        - name: cartIds
          in: query
          required: false
          description: 指定购物车商品 id，可重复传参（?cartIds=1&cartIds=2）；不传则取全部
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListCartPromotionItem'
  /cart/update/quantity:
    get:
      tags: [购物车]
      summary: 修改购物车中指定商品的数量
      description: 注意：该接口虽然会修改数据，但源码中声明为 GET（RequestMethod.GET），参数在 query 上。
      operationId: cartUpdateQuantity
      parameters:
        - name: id
          in: query
          required: true
          description: 购物车商品 id
          schema: {type: integer, format: int64}
        - name: quantity
          in: query
          required: true
          description: 修改后的数量
          schema: {type: integer, format: int32}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInt'
  /cart/getProduct/{productId}:
    get:
      tags: [购物车]
      summary: 获取购物车中指定商品的规格（用于重选规格）
      operationId: cartGetProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCartProduct'
  /cart/update/attr:
    post:
      tags: [购物车]
      summary: 修改购物车中商品的规格
      operationId: cartUpdateAttr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OmsCartItem'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInt'
  /cart/delete:
    post:
      tags: [购物车]
      summary: 删除购物车中的指定商品
      operationId: cartDelete
      parameters:
        - name: ids
          in: query
          required: true
          description: 购物车商品 id，可重复传参（?ids=1&ids=2）
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInt'
  /cart/clear:
    post:
      tags: [购物车]
      summary: 清空当前会员的购物车
      operationId: cartClear
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInt'
  /sso/register:
    post:
      tags: [会员登录注册]
      summary: 会员注册
      description: 参数为 @RequestParam，按表单提交（query 亦可）。需先调用 /sso/getAuthCode 获取验证码。
      operationId: ssoRegister
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password, telephone, authCode]
              properties:
                username: {type: string}
                password: {type: string}
                telephone: {type: string}
                authCode: {type: string}
      responses:
        '200':
          description: 成功后 message 为「注册成功」，data 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultNull'
  /sso/login:
    post:
      tags: [会员登录注册]
      summary: 会员登录（获取 token）
      description: 参数为 @RequestParam，按表单提交。用户名密码错误返回 code=404（CommonResult.validateFailed）。
      operationId: ssoLogin
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
      responses:
        '200':
          description: 成功返回 token 与 tokenHead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultToken'
  /sso/info:
    get:
      tags: [会员登录注册]
      summary: 获取会员信息
      operationId: ssoInfo
      responses:
        '200':
          description: principal 为空时返回 code=401；注意返回体含 password 等敏感字段，客户端应忽略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUmsMember'
  /sso/getAuthCode:
    get:
      tags: [会员登录注册]
      summary: 获取验证码
      operationId: ssoGetAuthCode
      security: []
      parameters:
        - name: telephone
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: data 为验证码字符串
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultString'
  /sso/updatePassword:
    post:
      tags: [会员登录注册]
      summary: 会员修改密码
      operationId: ssoUpdatePassword
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [telephone, password, authCode]
              properties:
                telephone: {type: string}
                password: {type: string}
                authCode: {type: string}
      responses:
        '200':
          description: 成功后 message 为「密码修改成功」
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultNull'
  /sso/refreshToken:
    get:
      tags: [会员登录注册]
      summary: 刷新 token
      description: 需要携带旧 token；token 已过期返回 code=500，message 为「token已经过期！」
      operationId: ssoRefreshToken
      responses:
        '200':
          description: 返回新的 token 与 tokenHead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultToken'
  /order/generateConfirmOrder:
    post:
      tags: [订单]
      summary: 根据购物车信息生成确认单
      operationId: orderGenerateConfirmOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: 选中的购物车商品 id 列表
              items:
                type: integer
                format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultConfirmOrderResult'
  /order/generateOrder:
    post:
      tags: [订单]
      summary: 根据购物车信息生成订单
      operationId: orderGenerateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderParam'
      responses:
        '200':
          description: 成功 message 为「下单成功」，data 为 {order: OmsOrder}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultGenerateOrder'
  /order/paySuccess:
    post:
      tags: [订单]
      summary: 用户支付成功的回调
      operationId: orderPaySuccess
      parameters:
        - name: orderId
          in: query
          required: true
          schema: {type: integer, format: int64}
        - name: payType
          in: query
          required: true
          description: 支付方式：0->未支付；1->支付宝；2->微信
          schema: {type: integer, format: int32}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInt'
  /order/cancelTimeOutOrder:
    post:
      tags: [订单]
      summary: 自动取消超时订单
      operationId: orderCancelTimeOutOrder
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultNull'
  /order/cancelOrder:
    post:
      tags: [订单]
      summary: 取消单个超时订单（发送延迟消息）
      operationId: orderCancelOrder
      parameters:
        - name: orderId
          in: query
          required: false
          description: 源码未标注必填，实际业务需要
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultNull'
  /order/list:
    get:
      tags: [订单]
      summary: 按状态分页获取用户订单列表
      operationId: orderList
      parameters:
        - name: status
          in: query
          required: true
          description: 订单状态：-1->全部；0->待付款；1->待发货；2->已发货；3->已完成；4->已关闭
          schema:
            type: integer
            format: int32
            default: -1
            enum: [-1, 0, 1, 2, 3, 4]
        - name: pageNum
          in: query
          required: false
          schema: {type: integer, format: int32, default: 1}
        - name: pageSize
          in: query
          required: false
          schema: {type: integer, format: int32, default: 5}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPageOmsOrderDetail'
  /order/detail/{orderId}:
    get:
      tags: [订单]
      summary: 根据 ID 获取订单详情
      operationId: orderDetail
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOmsOrderDetail'
  /order/cancelUserOrder:
    post:
      tags: [订单]
      summary: 用户取消订单
      description: 参数为裸简单类型，走 query 参数，不是 body。
      operationId: orderCancelUserOrder
      parameters:
        - name: orderId
          in: query
          required: false
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultNull'
  /order/confirmReceiveOrder:
    post:
      tags: [订单]
      summary: 用户确认收货
      description: 参数为裸简单类型，走 query 参数，不是 body。
      operationId: orderConfirmReceiveOrder
      parameters:
        - name: orderId
          in: query
          required: false
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultNull'
  /order/deleteOrder:
    post:
      tags: [订单]
      summary: 用户删除订单
      description: 参数为裸简单类型，走 query 参数，不是 body。
      operationId: orderDeleteOrder
      parameters:
        - name: orderId
          in: query
          required: false
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultNull'
  /home/content:
    get:
      tags: [首页]
      summary: 首页内容信息展示
      operationId: homeContent
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultHomeContentResult'
  /home/recommendProductList:
    get:
      tags: [首页]
      summary: 分页获取推荐商品
      operationId: homeRecommendProductList
      security: []
      parameters:
        - name: pageSize
          in: query
          required: false
          schema: {type: integer, format: int32, default: 4}
        - name: pageNum
          in: query
          required: false
          schema: {type: integer, format: int32, default: 1}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListPmsProduct'
  /home/productCateList/{parentId}:
    get:
      tags: [首页]
      summary: 获取首页商品分类
      operationId: homeProductCateList
      security: []
      parameters:
        - name: parentId
          in: path
          required: true
          description: 父分类 id，0 表示一级分类
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListPmsProductCategory'
  /home/subjectList:
    get:
      tags: [首页]
      summary: 根据分类获取专题
      operationId: homeSubjectList
      security: []
      parameters:
        - name: cateId
          in: query
          required: false
          schema: {type: integer, format: int64}
        - name: pageSize
          in: query
          required: false
          schema: {type: integer, format: int32, default: 4}
        - name: pageNum
          in: query
          required: false
          schema: {type: integer, format: int32, default: 1}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListCmsSubject'
  /home/hotProductList:
    get:
      tags: [首页]
      summary: 分页获取人气推荐商品
      operationId: homeHotProductList
      security: []
      parameters:
        - name: pageNum
          in: query
          required: false
          schema: {type: integer, format: int32, default: 1}
        - name: pageSize
          in: query
          required: false
          schema: {type: integer, format: int32, default: 6}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListPmsProduct'
  /home/newProductList:
    get:
      tags: [首页]
      summary: 分页获取新品推荐商品
      operationId: homeNewProductList
      security: []
      parameters:
        - name: pageNum
          in: query
          required: false
          schema: {type: integer, format: int32, default: 1}
        - name: pageSize
          in: query
          required: false
          schema: {type: integer, format: int32, default: 6}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListPmsProduct'
  /product/search:
    get:
      tags: [商品]
      summary: 综合搜索、筛选、排序
      operationId: productSearch
      security: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema: {type: string}
        - name: brandId
          in: query
          required: false
          schema: {type: integer, format: int64}
        - name: productCategoryId
          in: query
          required: false
          schema: {type: integer, format: int64}
        - name: pageNum
          in: query
          required: false
          description: 源码默认值为 0（不是常见的 1）
          schema: {type: integer, format: int32, default: 0}
        - name: pageSize
          in: query
          required: false
          schema: {type: integer, format: int32, default: 5}
        - name: sort
          in: query
          required: false
          description: 排序字段：0->按相关度；1->按新品；2->按销量；3->价格从低到高；4->价格从高到低
          schema:
            type: integer
            format: int32
            default: 0
            enum: [0, 1, 2, 3, 4]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPagePmsProduct'
  /product/categoryTreeList:
    get:
      tags: [商品]
      summary: 以树形结构获取所有商品分类
      operationId: productCategoryTreeList
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListPmsProductCategoryNode'
  /product/detail/{id}:
    get:
      tags: [商品]
      summary: 获取前台商品详情
      operationId: productDetail
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: 商品 id
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPmsPortalProductDetail'
  /brand/recommendList:
    get:
      tags: [品牌]
      summary: 分页获取推荐品牌
      operationId: brandRecommendList
      security: []
      parameters:
        - name: pageSize
          in: query
          required: false
          schema: {type: integer, format: int32, default: 6}
        - name: pageNum
          in: query
          required: false
          schema: {type: integer, format: int32, default: 1}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListPmsBrand'
  /brand/detail/{brandId}:
    get:
      tags: [品牌]
      summary: 获取品牌详情
      operationId: brandDetail
      security: []
      parameters:
        - name: brandId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPmsBrand'
  /brand/productList:
    get:
      tags: [品牌]
      summary: 分页获取品牌相关商品
      operationId: brandProductList
      security: []
      parameters:
        - name: brandId
          in: query
          required: true
          schema: {type: integer, format: int64}
        - name: pageNum
          in: query
          required: false
          schema: {type: integer, format: int32, default: 1}
        - name: pageSize
          in: query
          required: false
          schema: {type: integer, format: int32, default: 6}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPagePmsProduct'
  /member/attention/add:
    post:
      tags: [品牌关注]
      summary: 添加品牌关注
      operationId: attentionAdd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberBrandAttention'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInt'
  /member/attention/delete:
    post:
      tags: [品牌关注]
      summary: 取消品牌关注
      description: 参数为裸简单类型，走 query 参数。
      operationId: attentionDelete
      parameters:
        - name: brandId
          in: query
          required: false
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInt'
  /member/attention/list:
    get:
      tags: [品牌关注]
      summary: 分页查询当前用户品牌关注列表
      operationId: attentionList
      parameters:
        - name: pageNum
          in: query
          required: false
          schema: {type: integer, format: int32, default: 1}
        - name: pageSize
          in: query
          required: false
          schema: {type: integer, format: int32, default: 5}
      responses:
        '200':
