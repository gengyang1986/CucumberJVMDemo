  /alipay/pay:
    get:
      tags: [支付宝]
      summary: 支付宝电脑网站支付
      description: 参数为 AliPayParam 的对象绑定（无注解），走 query 参数。响应不是 JSON，而是 text/html 的支付表单，由客户端提交到支付宝。
      operationId: alipayPay
      security: []
      parameters:
        - name: outTradeNo
          in: query
          required: true
          description: 商户订单号，需唯一
          schema: {type: string}
        - name: subject
          in: query
          required: true
          description: 订单标题
          schema: {type: string}
        - name: totalAmount
          in: query
          required: true
          description: 订单总金额，单位元，两位小数
          schema: {type: number}
      responses:
        '200':
          description: 返回 HTML 支付表单
          content:
            text/html:
              schema: {type: string}
  /alipay/webPay:
    get:
      tags: [支付宝]
      summary: 支付宝手机网站支付
      description: 响应为 text/html 支付表单，非 JSON。
      operationId: alipayWebPay
      security: []
      parameters:
        - name: outTradeNo
          in: query
          required: true
          schema: {type: string}
        - name: subject
          in: query
          required: true
          schema: {type: string}
        - name: totalAmount
          in: query
          required: true
          schema: {type: number}
      responses:
        '200':
          description: 返回 HTML 支付表单
          content:
            text/html:
              schema: {type: string}
  /alipay/notify:
    post:
      tags: [支付宝]
      summary: 支付宝异步回调
      description: 源码中该方法位于 @Controller 且未加 @ResponseBody，返回的 success/failure 会被当作视图名解析；若需真正返回纯文本，应在代码上补 @ResponseBody。此处按设计意图记录响应。
      operationId: alipayNotify
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: 支付宝回调参数（全部以表单形式提交）
              additionalProperties:
                type: string
      responses:
        '200':
          description: 设计意图为返回 success 或 failure
          content:
            text/plain:
              schema:
                type: string
                enum: [success, failure]
  /alipay/query:
    get:
      tags: [支付宝]
      summary: 支付宝统一收单线下交易查询
      description: 支付成功时 data 为交易状态 TRADE_SUCCESS
      operationId: alipayQuery
      security: []
      parameters:
        - name: outTradeNo
          in: query
          required: false
          description: 商户订单号（与 tradeNo 二选一）
          schema: {type: string}
        - name: tradeNo
          in: query
          required: false
          description: 支付宝交易号（与 outTradeNo 二选一）
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultString'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 值为登录返回的 tokenHead + token，即 `Bearer <token>`；请求头名由 jwt.tokenHeader 配置，默认 Authorization。
  schemas:
    CommonResult:
      type: object
      description: 通用返回结果
      properties:
        code:
          type: integer
          format: int64
          description: 200 成功；404 参数校验失败；401 未登录或 token 过期；403 无权限；500 操作失败
        message:
          type: string
        data:
          type: object
          nullable: true
      required: [code, message]
    TokenInfo:
      type: object
      properties:
        token: {type: string, description: JWT}
        tokenHead: {type: string, description: 前缀，默认 'Bearer '}
    ResultNull:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
    ResultInt:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data: {type: integer, format: int32, description: 影响行数}
    ResultString:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data: {type: string}
    ResultToken:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenInfo'
    OmsCartItem:
      type: object
      description: 购物车条目（mall-mbg OmsCartItem）
      properties:
        id: {type: integer, format: int64}
        productId: {type: integer, format: int64}
        productSkuId: {type: integer, format: int64}
        memberId: {type: integer, format: int64}
        quantity: {type: integer, format: int32, description: 购买数量}
        price: {type: number, description: 添加到购物车的价格}
        productPic: {type: string, description: 商品主图}
        productName: {type: string, description: 商品名称}
        productSubTitle: {type: string, description: 商品副标题（卖点）}
        productSkuCode: {type: string, description: 商品 sku 条码}
        memberNickname: {type: string, description: 会员昵称}
        createDate: {type: string, format: date-time}
        modifyDate: {type: string, format: date-time}
        deleteStatus: {type: integer, format: int32, description: 是否删除}
        productCategoryId: {type: integer, format: int64, description: 商品分类}
        productBrand: {type: string}
        productSn: {type: string}
        productAttr: {type: string, description: '商品销售属性 JSON 数组：[{"key":"颜色","value":"红色"},{"key":"容量","value":"4G"}]'}
    CartPromotionItem:
      allOf:
        - $ref: '#/components/schemas/OmsCartItem'
        - type: object
          properties:
            promotionMessage: {type: string, description: 促销活动信息}
            reduceAmount: {type: number, description: 促销活动减去的金额，针对每个商品}
            realStock: {type: integer, format: int32, description: 剩余库存-锁定库存}
            integration: {type: integer, format: int32, description: 购买商品赠送积分}
            growth: {type: integer, format: int32, description: 购买商品赠送成长值}
    PmsProduct:
      type: object
      description: 商品（mall-mbg PmsProduct）
      properties:
        id: {type: integer, format: int64}
        brandId: {type: integer, format: int64}
        productCategoryId: {type: integer, format: int64}
        feightTemplateId: {type: integer, format: int64}
        productAttributeCategoryId: {type: integer, format: int64}
        name: {type: string}
        pic: {type: string}
        productSn: {type: string, description: 货号}
        deleteStatus: {type: integer, format: int32, description: '删除状态：0->未删除；1->已删除'}
        publishStatus: {type: integer, format: int32, description: '上架状态：0->下架；1->上架'}
        newStatus: {type: integer, format: int32, description: '新品状态：0->不是；1->是'}
        recommandStatus: {type: integer, format: int32, description: '推荐状态：0->不推荐；1->推荐'}
        verifyStatus: {type: integer, format: int32, description: '审核状态：0->未审核；1->审核通过'}
        sort: {type: integer, format: int32}
        sale: {type: integer, format: int32, description: 销量}
        price: {type: number}
        promotionPrice: {type: number, description: 促销价格}
        giftGrowth: {type: integer, format: int32, description: 赠送的成长值}
        giftPoint: {type: integer, format: int32, description: 赠送的积分}
        usePointLimit: {type: integer, format: int32, description: 限制使用的积分数}
        subTitle: {type: string, description: 副标题}
        originalPrice: {type: number, description: 市场价}
        stock: {type: integer, format: int32, description: 库存}
        lowStock: {type: integer, format: int32, description: 库存预警值}
        unit: {type: string}
        weight: {type: number, description: 商品重量，默认克}
        previewStatus: {type: integer, format: int32, description: '是否为预告商品：0->不是；1->是'}
        serviceIds: {type: string, description: 以逗号分割的服务：1->无忧退货；2->快速退款；3->免费包邮}
        keywords: {type: string}
        note: {type: string}
        albumPics: {type: string, description: 画册图片，逗号分割，最多 5 张}
        detailTitle: {type: string}
        promotionStartTime: {type: string, format: date-time}
        promotionEndTime: {type: string, format: date-time}
        promotionPerLimit: {type: integer, format: int32, description: 活动限购数量}
        promotionType: {type: integer, format: int32, description: '促销类型：0->原价；1->促销价；2->会员价；3->阶梯价；4->满减价；5->限时购'}
        brandName: {type: string}
        productCategoryName: {type: string}
        description: {type: string}
        detailDesc: {type: string}
        detailHtml: {type: string, description: 产品详情网页内容}
        detailMobileHtml: {type: string, description: 移动端网页详情}
    PmsProductAttribute:
      type: object
      properties:
        id: {type: integer, format: int64}
        productAttributeCategoryId: {type: integer, format: int64}
        name: {type: string}
        selectType: {type: integer, format: int32, description: '属性选择类型：0->唯一；1->单选；2->多选'}
        inputType: {type: integer, format: int32, description: '属性录入方式：0->手工录入；1->从列表选取'}
        inputList: {type: string, description: 可选值列表，逗号隔开}
        sort: {type: integer, format: int32}
        filterType: {type: integer, format: int32, description: 分类筛选样式}
        searchType: {type: integer, format: int32, description: '检索类型：0->不检索；1->关键字；2->范围'}
        relatedStatus: {type: integer, format: int32, description: '相同属性产品是否关联：0->不关联；1->关联'}
        handAddStatus: {type: integer, format: int32, description: '是否支持手动新增：0->不支持；1->支持'}
        type: {type: integer, format: int32, description: '属性类型：0->规格；1->参数'}
    PmsSkuStock:
      type: object
      properties:
        id: {type: integer, format: int64}
        productId: {type: integer, format: int64}
        skuCode: {type: string}
        price: {type: number}
        stock: {type: integer, format: int32}
        lowStock: {type: integer, format: int32, description: 预警库存}
        pic: {type: string, description: 展示图片}
        sale: {type: integer, format: int32}
        promotionPrice: {type: number, description: 单品促销价格}
        lockStock: {type: integer, format: int32, description: 锁定库存}
        spData: {type: string, description: 商品销售属性，JSON 格式}
    CartProduct:
      allOf:
        - $ref: '#/components/schemas/PmsProduct'
        - type: object
          properties:
            productAttributeList:
              type: array
              description: 商品属性列表
              items:
                $ref: '#/components/schemas/PmsProductAttribute'
            skuStockList:
              type: array
              description: 商品 SKU 库存列表
              items:
                $ref: '#/components/schemas/PmsSkuStock'
    UmsMember:
      type: object
      description: 会员信息；响应中含 password 字段，客户端应忽略
      properties:
        id: {type: integer, format: int64}
        memberLevelId: {type: integer, format: int64}
        username: {type: string}
        password: {type: string}
        nickname: {type: string}
        phone: {type: string}
        status: {type: integer, format: int32, description: '帐号启用状态：0->禁用；1->启用'}
        createTime: {type: string, format: date-time}
        icon: {type: string}
        gender: {type: integer, format: int32, description: '性别：0->未知；1->男；2->女'}
        birthday: {type: string, format: date-time}
        city: {type: string}
        job: {type: string}
        personalizedSignature: {type: string}
        sourceType: {type: integer, format: int32}
        integration: {type: integer, format: int32, description: 积分}
        growth: {type: integer, format: int32, description: 成长值}
        luckeyCount: {type: integer, format: int32, description: 剩余抽奖次数}
        historyIntegration: {type: integer, format: int32, description: 历史积分数量}
    UmsMemberReceiveAddress:
      type: object
